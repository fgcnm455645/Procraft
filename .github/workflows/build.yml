name: Build APK

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_VERSION: "1.99.0"
  NDK_VERSION: "29.0.14206865"

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source and phone patch
        run: |
          mkdir -p work
          unzip -q "$(ls procraft-0*.zip | head -n1)" -d work
          root="$(dirname "$(dirname "$(find work -path '*/android/gradlew' | head -n1)")")"
          unzip -qo procraft-phone-fit.zip -d "$root"
          echo "ROOT=$root" >>"$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.ROOT }}
          key: phone-android

      - name: Install cargo-ndk and the Android NDK
        run: |
          cargo install cargo-ndk --version "^4" --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >>"$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Build
        working-directory: ${{ env.ROOT }}/android
        run: chmod +x gradlew && ./gradlew --no-daemon :app:assembleRelease -Pprocraft.abis=arm64-v8a

      - uses: actions/upload-artifact@v4
        with:
          name: procraft-apk
          path: ${{ env.ROOT }}/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
